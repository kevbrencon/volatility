<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Spanish Flashcards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #fef3c7, #e0f2fe);
      padding: 16px;
    }

    .app {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.18);
      padding: 24px 24px 32px;
      max-width: 420px;
      width: 100%;
    }

    .app-header {
      text-align: center;
      margin-bottom: 18px;
    }

    .app-header h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    .app-header p {
      font-size: 0.85rem;
      color: #64748b;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: #475569;
    }

    .controls label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .controls input[type="radio"] {
      accent-color: #2563eb;
    }

    .card-wrapper {
      perspective: 1000px;
      margin-bottom: 20px;
    }

    .card {
      width: 100%;
      height: 200px;
      border-radius: 18px;
      position: relative;
      cursor: pointer;
      user-select: none;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s ease;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      text-align: center;
    }

    .card-front {
      background: linear-gradient(135deg, #eff6ff, #e0f2fe);
      border: 1px solid #bfdbfe;
    }

    .card-back {
      background: linear-gradient(135deg, #ecfccb, #dcfce7);
      border: 1px solid #bbf7d0;
      transform: rotateY(180deg);
    }

    .card-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 8px;
    }

    .card-word {
      font-size: 2rem;
      font-weight: 600;
      color: #0f172a;
    }

    .card-hint {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 4px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s ease;
    }

    button.secondary {
      background: #e2e8f0;
      color: #0f172a;
      box-shadow: none;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 25px rgba(37, 99, 235, 0.3);
    }

    button.secondary:hover {
      box-shadow: 0 8px 18px rgba(148, 163, 184, 0.35);
    }

    button:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .note {
      text-align: center;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    @media (max-width: 480px) {
      .app {
        padding: 18px 16px 24px;
      }

      .card {
        height: 180px;
      }

      .card-word {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="app-header">
      <h1>Spanish Flashcards</h1>
      <p>Click the card to flip between Spanish and English.</p>
    </div>

    <div class="controls">
      <label>
        <input type="radio" name="direction" value="es-en" checked />
        ES → EN
      </label>
      <label>
        <input type="radio" name="direction" value="en-es" />
        EN → ES
      </label>
    </div>

    <div class="card-wrapper">
      <div class="card" id="card">
        <div class="card-inner">
          <div class="card-face card-front">
            <div class="card-label" id="front-label">Spanish</div>
            <div class="card-word" id="card-front-text">casa</div>
            <div class="card-hint">Click to see the translation</div>
          </div>
          <div class="card-face card-back">
            <div class="card-label" id="back-label">English</div>
            <div class="card-word" id="card-back-text">house</div>
            <div class="card-hint">Click to go back</div>
          </div>
        </div>
      </div>
    </div>

    <div class="buttons">
      <button class="secondary" id="flipBtn">Flip card</button>
      <button id="nextBtn">Next word</button>
    </div>

    <div class="note">
      To add more words, edit the <strong>WORDS</strong> list in the code.
    </div>
  </div>

  <script>
    // ======= WORD LIST =======
    // Add or change words here. Keep the same { en: "", es: "" } format.
    const WORDS = [
      { en: "house",  es: "casa" },
      { en: "table",  es: "mesa" },
      { en: "book",   es: "libro" },
      { en: "chair",  es: "silla" },
      { en: "door",   es: "puerta" },
      { en: "window", es: "ventana" },
      { en: "street", es: "calle" },
      { en: "car",    es: "coche" },
      { en: "water",  es: "agua" },
      { en: "dog",    es: "perro" },
      { en: "cat",    es: "gato" },
      { en: "boy",    es: "niño" },
      { en: "girl",    es: "niña" },
      { en: "woman",    es: "mujer"},
      { en: "man",    es: "hombre" },
      { en: "city",    es: "ciudad" },
      { en: "school",    es: "escuela" },
      { en: "food",    es: "comida" }
    ];

    // ======= STATE =======
    let currentIndex = 0;
    let showSpanishFirst = true; // ES → EN by default

    const card      = document.getElementById("card");
    const flipBtn   = document.getElementById("flipBtn");
    const nextBtn   = document.getElementById("nextBtn");

    const frontText = document.getElementById("card-front-text");
    const backText  = document.getElementById("card-back-text");
    const frontLabel = document.getElementById("front-label");
    const backLabel  = document.getElementById("back-label");

    // ======= FUNCTIONS =======
    function getRandomIndex() {
      if (WORDS.length === 0) return 0;
      return Math.floor(Math.random() * WORDS.length);
    }

    function loadNewWord() {
      if (WORDS.length === 0) return;

      let newIndex = getRandomIndex();
      // Avoid the same word twice in a row when possible
      if (WORDS.length > 1) {
        while (newIndex === currentIndex) {
          newIndex = getRandomIndex();
        }
      }
      currentIndex = newIndex;
      updateCard();
    }

    function updateCard() {
      const word = WORDS[currentIndex];
      if (!word) return;

      if (showSpanishFirst) {
        frontText.textContent = word.es;
        backText.textContent  = word.en;
        frontLabel.textContent = "Spanish";
        backLabel.textContent  = "English";
      } else {
        frontText.textContent = word.en;
        backText.textContent  = word.es;
        frontLabel.textContent = "English";
        backLabel.textContent  = "Spanish";
      }

      // Reset to front side
      card.classList.remove("flipped");
    }

    function flipCard() {
      card.classList.toggle("flipped");
    }

    // ======= EVENT LISTENERS =======
    // Flip by clicking the card
    card.addEventListener("click", flipCard);

    // Flip using the button
    flipBtn.addEventListener("click", flipCard);

    // Get the next random word
    nextBtn.addEventListener("click", loadNewWord);

    // Change direction ES↔EN
    document.querySelectorAll('input[name="direction"]').forEach(radio => {
      radio.addEventListener("change", (event) => {
        showSpanishFirst = event.target.value === "es-en";
        updateCard();
      });
    });

    // ======= INITIALISE =======
    updateCard();
  </script>
</body>
</html>
